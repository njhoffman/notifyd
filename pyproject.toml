[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notifyd"
dynamic = ["version"]
description = "Desktop notification daemon for X11: deadd's look, dunst's rules, presets, a notify-send replacement and a colorful log"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "PyGObject>=3.42"]

[project.scripts]
notifyd = "notifyd.cli:main"

[tool.setuptools.dynamic]
version = { attr = "notifyd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notifyd = ["presets/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "SIM105", "SIM108"]   # ★ · × in text are intended; try/except reads fine
