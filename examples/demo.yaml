# The config of `tools/demo.sh` (`just demo`): a private daemon shows the tour with these settings, and
# each rule below is what one step of it demonstrates. The apps are named demo-* so the rules catch only
# the demo's notifications. NOTIFYD_PRIVATE_DIR (tools/with-daemon.sh) and NOTIFYD_DEMO_SEND (the demo) are set for it.

preset: tokyonight
width: 380
timeout: 6s
timeout-critical: 10s          # critical ones stay until closed by default
timeout-bar: true              # the thin bar that drains as the timer runs
position:
  anchor: top-center           # away from the top-right stack of the daemon you run
  margin: [40, 0]
history:
  persist: false
center:
  keyboard: false              # the demo opens and closes it itself

rules:
  # rules: a regex with named groups rewrites the text, and the urgency goes up
  - name: battery
    match: { app: demo-battery, summary: '/(?P<pct>\d+)%/' }
    urgency: critical
    summary: 'Battery at {pct}%'
    body: '{body} · <span class="bad">plug in now</span>'

  # rules: buttons that run commands (sh, in the background, NOTIFYD_* in the environment)
  - name: player
    match: { app: demo-player }
    buttons:
      - { label: Shuffle, run: '"$NOTIFYD_DEMO_SEND" -a demo-player-ran "Shuffled" "a rule button ran a command"' }
      - { label: Next, run: '"$NOTIFYD_DEMO_SEND" -a demo-player-ran "Next track" "a rule button ran a command"' }

  # rules: a command run for each match, with the notification as JSON on stdin
  - name: hook
    match: { category: '/^demo\./' }
    run: 'printf "%s (%s)\n" "$NOTIFYD_SUMMARY" "$NOTIFYD_RULES" >> "$NOTIFYD_PRIVATE_DIR/run.log"'

  # rules: notifyd ctl mode dnd holds back everything but critical
  - name: do-not-disturb
    match: { mode: dnd, urgency: [low, normal] }
    skip: true

  # stacking: one popup per app, counting up (×N)
  - name: chat
    match: { app: demo-chat }
    group-by: [app]

  # stacking: a stack tag from a rule, so the sender need not send one
  - name: downloads
    match: { app: demo-download }
    stack-tag: download

  # styles: a timeout and hidden parts
  - name: quick
    match: { app: demo-quick }
    timeout: 2s
    hide: [app-icon, app-name, time]

  # styles: another preset for one app
  - name: card
    match: { app: demo-card }
    preset: card

  # styles: preset keys overridden for one app, plus raw CSS
  - name: styled
    match: { app: demo-style }
    style:
      background: 'rgba(36, 16, 56, 0.94)'
      border-color: '#bb9af7'
      border-width: 2
      radius: 10
      title: { color: '#e0af68', size: 17px }
      body: { color: '#c0caf5' }
      css: '& .title { letter-spacing: 2px; }'
